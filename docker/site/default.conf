limit_req_zone $binary_remote_addr zone=goatcounter:10m rate=2r/s;

# Pull the ref value out of the /count request.
# count.js URL-encodes the page's query string, so match both
# "ref=cv" and "%3Fref%3Dcv" / "%26ref%3Dcv".
map $request_uri $gc_ref {
    default "";
    "~*(?:[?&]|%3F|%26)ref(?:=|%3D)([A-Za-z0-9_-]+)"  $1;
}

# The allowlist. Add one line per ref you want counted.
map $gc_ref $gc_ref_allowed {
    default   0;
    cv        1;
    # linkedin  1;
    # github    1;
}

set_real_ip_from 172.24.0.0/16;
real_ip_header   CF-Connecting-IP;

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    location = /count.js {
        proxy_pass http://goatcounter:8080/count.js;
        proxy_cache off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /count {
        # Silently drop anything without an allowed ref
        if ($gc_ref_allowed = 0) {
            return 204;
        }

        limit_req zone=goatcounter burst=5 nodelay;
        proxy_pass http://goatcounter:8080/count;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Referer $http_referer;
    }
}
