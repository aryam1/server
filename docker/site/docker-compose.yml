networks:
  proxy:
    external: true

services:
  site:
    image: nginx:alpine
    container_name: site
    restart: unless-stopped
    volumes:
      - /server/websites:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`aryam.dev`)
      - traefik.http.routers.site.entrypoints=public
      - traefik.http.routers.site.middlewares=site-hsts
      - traefik.http.middlewares.site-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.site-hsts.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.site-hsts.headers.stsPreload=true
      - traefik.http.services.site.loadbalancer.server.port=80
    networks:
      - proxy

  site-dev:
    image: nginx:alpine
    container_name: site-dev
    restart: unless-stopped
    volumes:
      - /server/websites:/usr/share/nginx/html:ro
      - ./nocache.conf:/etc/nginx/conf.d/nocache.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.site-dev.rule=Host(`dev.aryam.dev`)
      - traefik.http.routers.site-dev.entrypoints=private
      - traefik.http.services.site-dev.loadbalancer.server.port=80
    networks:
      - proxy
