networks:
  proxy:
    external: true
  internal:
    driver: bridge

services: 
  prow: 
    image: lscr.io/linuxserver/prowlarr:latest 
    container_name: prow
    networks:
      - internal
      - proxy
    environment: 
      - PUID=1000 
      - PGID=1000 
      - TZ=Europe/London 
    volumes: 
      - ./config:/config 
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.http.routers.prowlarr.entrypoints=private
      - traefik.http.services.prowlarr.loadbalancer.server.port=9696

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks: 
      - internal
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped 
