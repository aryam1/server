global:
  checkNewVersion: false
  sendAnonymousUsage: false

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  bufferingSize: 100
  filters:
    statusCodes:
      - "200-299"
      - "400-599"
    retryAttempts: true
    minDuration: "10ms"
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
        Cf-Ipcountry: keep

log:
  level: INFO

api:
  dashboard: true
  debug: true
  insecure: true

ping: {}

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: public
          scheme: https

  public:
    address: :443
    http:
      tls:
        certResolver: cf

  private:
    address: :8443
    http:
      tls:
        certResolver: cf

certificatesResolvers:
  cf:
    acme:
      email: arya.mukherjee@hotmail.com
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: proxy
    defaultRule: "Host(`{{ index .Labels \"com.docker.compose.service\" }}.aryam.dev`)"
