<!doctype html>
<html lang="en" style="background: #050508; color-scheme: dark">

<head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050508" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aryam.dev</title>
    <!-- Critical first-paint: must not depend on external CSS files.
         Inline block ensures the page is dark even during the brief window
         where stylesheets are still loading in parallel. -->
    <style>
        html, body, #paint-guard, #canvas-container { background: #050508; }
        #paint-guard { position: fixed; inset: 0; z-index: 2147483647; pointer-events: none; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    </style>
    <!-- Keep first-paint dark styles inline on <html>/<body>; the rest of the theme loads from split CSS. -->
    <link rel="stylesheet" href="assets/styles/fonts.css" />
    <link rel="stylesheet" href="assets/styles/tokens.css" />
    <link rel="stylesheet" href="assets/styles/base.css" />
    <link rel="stylesheet" href="assets/styles/navigation.css" />
    <link rel="stylesheet" href="assets/styles/hero.css" />
    <link rel="stylesheet" href="assets/styles/sections.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!-- Script order matters: theme tokens first, then Three.js scene setup, then scroll/navigation loop. -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script defer src="assets/scripts/theme.js"></script>
    <script defer src="assets/scripts/globe.js"></script>
    <script defer src="assets/scripts/navigation.js"></script>
    <script defer src="assets/scripts/render.js"></script>
</head>

<body style="background: #050508">
    <div id="paint-guard"></div>

    <!-- Three.js renders into this div. The canvas is appended by JS. -->
    <div id="canvas-container"></div>

    <nav id="section-nav" aria-label="Section navigation"></nav>

    <div id="coords"></div>

    <!-- HERO — full viewport section. Pointer events stay disabled
     so the globe canvas beneath receives drag events. -->
    <section id="s0">
        <div id="hero">
            <div id="hero-text">
                <div id="hero-name">aryam.dev</div>
            </div>
        </div>
    </section>

    <div id="content"></div>

    <div id="footer">
        <span id="footer-text"></span>
    </div>

</body>

</html>
