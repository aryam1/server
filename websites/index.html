<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aryam.dev</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #050508; overflow: hidden; font-family: 'JetBrains Mono', 'Courier New', monospace; color: #e0e0e0; cursor: grab; }
  body.dragging { cursor: grabbing; }
  canvas { display: block; }
  #overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  #name {
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 400; letter-spacing: 0.25em; color: #ffffff;
    opacity: 0; animation: fadein 2s ease 1.2s forwards;
  }
  #sub {
    font-size: clamp(0.65rem, 1.5vw, 0.8rem);
    letter-spacing: 0.4em; color: #4a9eff;
    margin-top: 0.75rem; text-transform: uppercase;
    opacity: 0; animation: fadein 2s ease 1.8s forwards;
  }
  #hint {
    position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
    font-size: 0.6rem; letter-spacing: 0.2em; color: #2a2a3a;
    opacity: 0; animation: fadein 2s ease 3s forwards;
    text-transform: uppercase; pointer-events: none;
  }
  #coords {
    position: fixed; bottom: 2rem; right: 2rem;
    font-size: 0.65rem; letter-spacing: 0.15em; color: #2a2a3a;
    opacity: 0; animation: fadein 2s ease 2.5s forwards;
    pointer-events: none;
  }
  @keyframes fadein { to { opacity: 1; } }
</style>
</head>
<body>
<div id="overlay">
  <div id="name">aryam.dev</div>
  <div id="sub">systems · infrastructure · development</div>
</div>
<div id="hint">drag to rotate · scroll to zoom</div>
<div id="coords"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 2.8;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x050508, 1);
document.body.appendChild(renderer.domElement);

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 36, 24),
  new THREE.MeshBasicMaterial({ color: 0x1a3a5c, wireframe: true, transparent: true, opacity: 0.55 })
);
scene.add(globe);

const dotGeo = new THREE.BufferGeometry();
const positions = [];
for (let i = 0; i < 420; i++) {
  const phi = Math.acos(2 * Math.random() - 1);
  const theta = 2 * Math.PI * Math.random();
  positions.push(1.002 * Math.sin(phi) * Math.cos(theta), 1.002 * Math.cos(phi), 1.002 * Math.sin(phi) * Math.sin(theta));
}
dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
globe.add(new THREE.Points(dotGeo, new THREE.PointsMaterial({ color: 0x4a9eff, size: 0.018, transparent: true, opacity: 0.8 })));

[[Math.PI/2, 0, 0x4a9eff, 0.25], [Math.PI/3, Math.PI/5, 0x1a6aaa, 0.18]].forEach(([rx, ry, color, op]) => {
  const r = new THREE.Mesh(new THREE.TorusGeometry(1.08, 0.003, 2, 120), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op }));
  r.rotation.x = rx; r.rotation.y = ry;
  globe.add(r);
});

const starPos = [];
for (let i = 0; i < 1800; i++) starPos.push((Math.random()-.5)*80, (Math.random()-.5)*80, (Math.random()-.5)*80);
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true, opacity: 0.35 })));

let isDragging = false;
let prev = { x: 0, y: 0 };
let vel = { x: 0, y: 0 };
let autoRotate = true;
let autoTimer;

function startDrag(x, y) {
  isDragging = true;
  autoRotate = false;
  clearTimeout(autoTimer);
  prev = { x, y };
  vel = { x: 0, y: 0 };
  document.body.classList.add('dragging');
}

function moveDrag(x, y) {
  if (!isDragging) return;
  vel.x = (y - prev.y) * 0.005;
  vel.y = (x - prev.x) * 0.005;
  globe.rotation.x += vel.x;
  globe.rotation.y += vel.y;
  prev = { x, y };
}

function endDrag() {
  isDragging = false;
  document.body.classList.remove('dragging');
  autoTimer = setTimeout(() => { autoRotate = true; }, 2000);
}

renderer.domElement.addEventListener('mousedown', e => startDrag(e.clientX, e.clientY));
window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
window.addEventListener('mouseup', endDrag);

renderer.domElement.addEventListener('touchstart', e => startDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
window.addEventListener('touchmove', e => moveDrag(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
window.addEventListener('touchend', endDrag);

window.addEventListener('wheel', e => {
  camera.position.z = Math.max(1.5, Math.min(5, camera.position.z + e.deltaY * 0.002));
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const coordsEl = document.getElementById('coords');

function animate() {
  requestAnimationFrame(animate);
  if (!isDragging) {
    vel.x *= 0.95;
    vel.y *= 0.95;
    globe.rotation.x += vel.x;
    globe.rotation.y += vel.y;
    if (autoRotate) { globe.rotation.y += 0.0015; globe.rotation.x += 0.0003; }
  }
  const lon = Math.abs((globe.rotation.y * 180 / Math.PI) % 360).toFixed(2);
  const lat = Math.abs((globe.rotation.x * 180 / Math.PI) % 180).toFixed(2);
  coordsEl.textContent = `${lat}° N  ${lon}° E`;
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
